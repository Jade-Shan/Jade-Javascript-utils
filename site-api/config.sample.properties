# Jade Dungeon API 配置模板
#
# 用法：复制本文件为 config.properties 后按需修改。
# config.properties 已被 gitignore，不会提交；本模板会提交。
#
# 注意：加载路径相对**进程工作目录**解析，必须从项目根启动服务。
# 优先级：CLI 参数（--port / --host / --uploadPath）> 本文件 > 代码里的默认值。

# ---- 服务 ----
# 监听端口
PORT=8080
# 环境标识。为 development 时错误响应会带上异常细节，其他值只返回通用提示
NODE_ENV=development

# ---- Redis ----
# 连接地址与端口。代码里注册了 trpg / blog / auth 三个命名连接，
# 它们共用同一个实例（靠 key 前缀隔离数据），所以这里只配一组地址。
REDIS_HOST=127.0.0.1
REDIS_PORT=6379
# 连接标签（ioredis 的 connectionName），实际连接名会是 <REDIS_NAME>:trpg 这种形式。
# 仅用于在 Redis 的 CLIENT LIST 里识别是哪个服务、哪个环境连进来的，便于排查。
# 它不参与 Redis key 的拼接，所以改它不会影响数据读写，也不影响与旧后端共享数据。
REDIS_NAME=jade-dungeon-dev

# ---- 跨域（CORS）----
# 允许跨域访问的来源白名单，逗号分隔。要填**带协议和端口的完整 origin**，
# 因为浏览器发来的 Origin 头就是这个形式，字符串必须完全匹配
# （http://a.com 和 https://a.com、带端口和不带端口都算不同来源）。
#
# 留空或不配 = 放开所有来源（等同 '*'），适合本地开发。
# 配了之后，不在名单内的来源不会收到 CORS 头，浏览器会拦下响应。
#
# 无 Origin 头的请求（curl、conky 等非浏览器客户端）一律放行——
# CORS 是浏览器机制，拦它们没意义且会误伤天气接口的 conky 调用。
CROS_SITE=http://localhost:8082,http://www.jade-dongeon.cn,http://www.jade-dongeon.cn:8082

# ---- SQLite ----
# 数据库文件路径，相对进程工作目录（项目根）解析。目录不存在会自动创建。
# auth 模块的用户与 token 存在这里；blog / sandtable 等仍在 Redis。
SQLITE_PATH=data/jade-dungeon.db
# 读取连接池的 worker 数量。个人站点 8 个足够（实测 8 并发约 25000 次查询/秒）。
SQLITE_READ_POOL_SIZE=8
